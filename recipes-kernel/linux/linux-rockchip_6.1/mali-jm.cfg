# rockchip_linux_defconfig (in radxa/kernel's linux-6.1-stan-rkr5.1,
# see linux-rockchip_6.1.bbappend) sets CONFIG_MALI_CSF_SUPPORT=y - a
# shared, multi-board defconfig default presumably there for boards
# with a Valhall-generation Mali GPU (e.g. RK3588/Mali-G610). CSF
# (Command Stream Frontend) does not exist on Bifrost GPUs at all -
# the ZERO 3E's RK3566/Mali-G52 is Bifrost and only ever supports the
# older Job Manager (JM) interface (drivers/gpu/arm/bifrost/Kbuild:
# JM object files are only added `ifneq ($(CONFIG_MALI_CSF_SUPPORT),y)`).
#
# Left enabled, this also breaks the build outright under Yocto's
# out-of-tree kbuild: csf/mali_kbase_csf_firmware.c embeds a firmware
# blob via `.incbin "drivers/gpu/arm/bifrost/mali_csffw.bin"` (a path
# relative to the *source* tree), which only resolves for the vendor's
# own in-tree build layout, not OE's O= out-of-tree one - "Error: file
# not found" from the assembler, confirmed on a real build attempt.
# CONFIG_MALI_CSF_SUPPORT is not set
