# Paired with radxa-zero3e-rauc-ab.wks.in - OPT-IN (RADXA_ZERO3E_RAUC_AB
# = "1"), not the default. See radxa-zero3e-extlinux.conf for the
# non-RAUC baseline this replaces when enabled.
#
# This file is read as raw text by wic's get_custom_config() at
# do_image_wic time (bootloader --configfile=), not passed through
# bitbake's variable expansion like radxa-zero3e.wks.in itself.
#
# root=${rauc_root}, not a literal PARTUUID: symmetric A/B (RAUC) means
# this exact file is shared, byte-identical, by BOTH boot_a and boot_b
# (wic's "bootloader --configfile=" is a single global directive - there
# is no way to give the two boot partitions different extlinux.conf
# content in one wks file, confirmed by reading
# scripts/lib/wic/plugins/source/bootimg-partition.py). ${rauc_root} is
# a U-Boot env var, not a Linux/bitbake one - u-boot-radxa-zero3e's own
# rauc-ab.cfg (CONFIG_BOOTCOMMAND) sets it to "PARTUUID=<rootfs_a-or-b's
# uuid>" depending on which slot's BOOT_<X>_LEFT counter won, before
# calling "sysboot" to process this file - see that file's own comment
# for the full BOOT_ORDER/BOOT_<X>_LEFT scheme (RAUC's own uboot
# bootloader backend, src/bootloaders/uboot.c, expects exactly this).
default Yocto
label Yocto
	kernel /Image
	fdt /rk3566-radxa-zero-3e.dtb
	append root=${rauc_root} rootwait console=ttyFIQ0,1500000
