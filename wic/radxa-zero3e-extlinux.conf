# root= PARTUUID must match RK_ROOTDEV_UUID (classes/rockchip-image.bbclass).
# This file is read as raw text by wic's get_custom_config() at do_image_wic
# time (bootloader --configfile=), not passed through bitbake's variable
# expansion like radxa-zero3e.wks.in itself - ${RK_ROOTDEV_UUID} would NOT
# work here, hence the hardcoded value.
default Yocto
label Yocto
	kernel /Image
	fdt /rk3566-radxa-zero-3e.dtb
	append root=PARTUUID=614e0000-0000-4b53-8000-1d28000054a9 rootwait console=ttyFIQ0,1500000
