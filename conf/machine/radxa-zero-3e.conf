#@TYPE: Machine
#@NAME: Radxa ZERO 3E
#@DESCRIPTION: Radxa ZERO 3E, an ultra-compact SBC based on the Rockchip
# RK3566. Gigabit Ethernet variant of the ZERO 3 family (no Wi-Fi/BT,
# that's the ZERO 3W). https://radxa.com/products/zeros/zero3e/
#
# Kernel: uses this layer's linux-rockchip_6.1 recipe, but with its
# source swapped (see recipes-kernel/linux/linux-rockchip_6.1.bbappend,
# scoped to this machine only) from the layer's default JeffyCN/mirrors
# 6.1.57 to Radxa's own kernel-6.1 BSP fork at 6.1.115
# (linux-6.1-stan-rkr5.1) - the board's devicetree
# (rk3566-radxa-zero3.dtsi/rk3566-radxa-zero-3e.dts) lives natively in
# that source, no backport patch needed.
#
# U-Boot: the legacy 2017.09 Rockchip SDK fork used by u-boot-rockchip.bb
# (the default virtual/bootloader provider in this layer) has no ZERO 3
# support at all. Real board support only exists in mainline-style
# U-Boot (2024.xx), so this machine uses a separate recipe,
# u-boot-radxa-zero3e, built from the same source the upstream/official
# meta-rockchip layer uses for this exact board. See
# recipes-bsp/u-boot/u-boot-radxa-zero3e_2024.07.bb for details.

require conf/machine/include/rk356x.inc

KERNEL_DEVICETREE = "rockchip/rk3566-radxa-zero-3e.dtb"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-radxa-zero3e"
UBOOT_MACHINE = "radxa-zero-3-rk3566_defconfig"

# u-boot-radxa-zero3e's SPL loads u-boot.itb from a fixed raw sector
# (8MiB in), not the 2MiB offset generic-gptdisk.wks.in (this layer's
# default WKS_FILE) uses for the legacy u-boot-rockchip.bb SPL. See
# wic/radxa-zero3e.wks.in for the full explanation.
WKS_FILE = "radxa-zero3e.wks.in"

# Contents of the "boot" vfat partition (wic's bootimg-partition source
# plugin, driven by wic/radxa-zero3e.wks.in, copies these from
# DEPLOY_DIR_IMAGE - the matching extlinux.conf is NOT auto-generated,
# see wic/radxa-zero3e-extlinux.conf and the wks file for why). "Image"
# is the plain kernel binary kernel.bbclass always deploys alongside
# whatever ROCKCHIP_KERNEL_IMAGES packs into boot.img/zboot.img.
# "rk3566-radxa-zero-3e.dtb" is KERNEL_DEVICETREE's basename without the
# "rockchip/" vendor subdir - kernel-devicetree.bbclass strips it
# because KERNEL_DTBVENDORED defaults to "0". This exact flat filename
# must match wic/radxa-zero3e-extlinux.conf's "fdt" line.
IMAGE_BOOT_FILES = "Image rk3566-radxa-zero-3e.dtb"

# The ZERO 3E has Gigabit Ethernet instead of Wi-Fi/Bluetooth (that's the
# ZERO 3W variant), so no wifibt firmware is needed.
RK_WIFIBT_RRECOMMENDS = ""

# rockchip-librga and rockchip-mpp - already on the project's package
# list, needed for our own cross-compiled apps later.
IMAGE_INSTALL:append = " rockchip-librga rockchip-mpp"

# ffmpeg CLI, built against nyanmisaka/ffmpeg-rockchip with RKMPP/RKRGA
# hw accel (see recipes-multimedia/ffmpeg/ffmpeg_6.1.4.bbappend). Only
# the CLI for now, to test hw decode/encode on target; the individual
# libav* libs for cross-compiling our own apps are a separate, later
# step.
IMAGE_INSTALL:append = " ffmpeg"

# SSH access, password-only. dropbear (not openssh) - lightweight,
# oe-core's standard minimal-image SSH server, allows password auth by
# default with no extra config (its init script's default
# DROPBEAR_EXTRA_ARGS only sets "-w", which disables *root* login over
# SSH - unrelated to password vs key auth. No PACKAGECONFIG in
# dropbear.bb disables password auth either). ssh-server-dropbear is
# the IMAGE_FEATURES value core-image.bbclass maps to
# packagegroup-core-ssh-dropbear.
IMAGE_FEATURES:append = " ssh-server-dropbear"
