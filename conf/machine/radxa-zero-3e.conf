#@TYPE: Machine
#@NAME: Radxa ZERO 3E
#@DESCRIPTION: Radxa ZERO 3E, an ultra-compact SBC based on the Rockchip
# RK3566. Gigabit Ethernet variant of the ZERO 3 family (no Wi-Fi/BT,
# that's the ZERO 3W). https://radxa.com/products/zeros/zero3e/
#
# Kernel: uses this layer's linux-rockchip_6.1 recipe, but with its
# source swapped (see recipes-kernel/linux/linux-rockchip_6.1.bbappend,
# scoped to this machine only) from the layer's default JeffyCN/mirrors
# 6.1.57 to Radxa's own kernel-6.1 BSP fork at 6.1.115
# (linux-6.1-stan-rkr5.1) - the board's devicetree
# (rk3566-radxa-zero3.dtsi/rk3566-radxa-zero-3e.dts) lives natively in
# that source, no backport patch needed.
#
# U-Boot: the legacy 2017.09 Rockchip SDK fork used by u-boot-rockchip.bb
# (the default virtual/bootloader provider in this layer) has no ZERO 3
# support at all. Real board support only exists in mainline-style
# U-Boot (2024.xx), so this machine uses a separate recipe,
# u-boot-radxa-zero3e, built from the same source the upstream/official
# meta-rockchip layer uses for this exact board. See
# recipes-bsp/u-boot/u-boot-radxa-zero3e_2024.07.bb for details.

require conf/machine/include/rk356x.inc

KERNEL_DEVICETREE = "rockchip/rk3566-radxa-zero-3e.dtb"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-radxa-zero3e"
UBOOT_MACHINE = "radxa-zero-3-rk3566_defconfig"

# u-boot-radxa-zero3e's SPL loads u-boot.itb from a fixed raw sector
# (8MiB in), not the 2MiB offset generic-gptdisk.wks.in (this layer's
# default WKS_FILE) uses for the legacy u-boot-rockchip.bb SPL. See
# wic/radxa-zero3e.wks.in for the full explanation.
#
# RADXA_ZERO3E_RAUC_AB: opt-in symmetric A/B (RAUC) partition layout +
# U-Boot RAUC bootloader-backend support, OFF by default. This is a
# public layer - a single-rootfs image is the right default for most
# consumers of this board, and RAUC A/B is a deliberate per-product
# choice, not something to force on everyone. A downstream layer that
# wants it sets RADXA_ZERO3E_RAUC_AB = "1" (e.g. meta-toletus's own
# conf/layer.conf) - this toggles both the partition layout below
# (wic/radxa-zero3e-rauc-ab.wks.in vs the plain wic/radxa-zero3e.wks.in)
# and whether u-boot-radxa-zero3e_2024.07.bb's rauc-ab.cfg Kconfig
# fragment gets merged into U-Boot's compiled CONFIG_BOOTCOMMAND (see
# that recipe's own SRC_URI). ?= so a distro-level config can also set
# it without needing the weaker ??= - a downstream layer's plain
# assignment in its own .conf still wins either way.
RADXA_ZERO3E_RAUC_AB ?= "0"

WKS_FILE = "${@bb.utils.contains('RADXA_ZERO3E_RAUC_AB', '1', 'radxa-zero3e-rauc-ab.wks.in', 'radxa-zero3e.wks.in', d)}"

# Contents of the "boot" vfat partition (wic's bootimg-partition source
# plugin, driven by wic/radxa-zero3e.wks.in, copies these from
# DEPLOY_DIR_IMAGE - the matching extlinux.conf is NOT auto-generated,
# see wic/radxa-zero3e-extlinux.conf and the wks file for why). "Image"
# is the plain kernel binary kernel.bbclass always deploys alongside
# whatever ROCKCHIP_KERNEL_IMAGES packs into boot.img/zboot.img.
# "rk3566-radxa-zero-3e.dtb" is KERNEL_DEVICETREE's basename without the
# "rockchip/" vendor subdir - kernel-devicetree.bbclass strips it
# because KERNEL_DTBVENDORED defaults to "0". This exact flat filename
# must match wic/radxa-zero3e-extlinux.conf's "fdt" line.
IMAGE_BOOT_FILES = "Image rk3566-radxa-zero-3e.dtb"

# The ZERO 3E has Gigabit Ethernet instead of Wi-Fi/Bluetooth (that's the
# ZERO 3W variant), so no wifibt firmware is needed.
RK_WIFIBT_RRECOMMENDS = ""

# rockchip-librga and rockchip-mpp - already on the project's package
# list, needed for our own cross-compiled apps later.
IMAGE_INSTALL:append = " rockchip-librga rockchip-mpp"

# ffmpeg CLI, built against nyanmisaka/ffmpeg-rockchip with RKMPP/RKRGA
# hw accel (see recipes-multimedia/ffmpeg/ffmpeg_6.1.4.bbappend). Only
# the CLI for now, to test hw decode/encode on target; the individual
# libav* libs for cross-compiling our own apps are a separate, later
# step.
IMAGE_INSTALL:append = " ffmpeg"

# rknpu2-runtime (librknnrt.so + rknpu headers) - runtime+headers are
# one single package, not split into a -dev (see the recipe's own
# comments on why). The RK3566 has a real NPU, so the board image
# carries the runtime by default even before any app uses it.
IMAGE_INSTALL:append = " rknpu2-runtime"

# rockchip-libmali's MALI_PLATFORM defaults to "wayland" whenever
# DISTRO_FEATURES has "wayland" (poky's default - see rk356x.inc,
# which requires mali.inc's own weak default), regardless of whether
# a Wayland compositor is actually present.
#
# Originally forced to "gbm" here: this image had no compositor at
# all (KMS/DRM only), so the wayland-flavored libmali build didn't
# integrate EGL over plain GBM the way SDL2's kmsdrm driver needed -
# an SDL2 app failed at runtime with "Could not initialize SDL -
# kmsdrm not available" despite kmsdrm being compiled into SDL2 and
# building fine.
#
# Switched to "wayland" (2026-10) now that Faceui runs as an actual
# Weston client (meta-toletus: recipes-graphics/weston*,
# recipes-toletus/faceui) - with this still at "gbm", Faceui failed on
# real hardware with "Could not get EGL display" / "unable to create
# an EGL window surface ... EGL_BAD_MATCH" (tsdl_init failed, clean
# non-fatal exit, not a crash) - a gbm-built libmali blob apparently
# doesn't implement EGL_PLATFORM_WAYLAND at all. This is the exact
# single-platform-blob conflict flagged in meta-toletus's
# KNOWN_ISSUES.md before it was confirmed real: rockchip-libmali.bb
# builds via one meson flag (-Dplatform=${MALI_PLATFORM}), so Weston's
# own drm-backend.so (which also needs working EGL, just not via this
# exact flag's "gbm" value specifically) and a Wayland client can't
# both get their preferred platform from the same compiled blob.
# UNVERIFIED as of this change: whether Weston's own rendering still
# works with "wayland" instead of "gbm" - that's the actual experiment
# this flip is testing. If Weston breaks, revert and see
# KNOWN_ISSUES.md for the remaining options (software rendering in
# Faceui, or building two separate libmali package variants).
MALI_PLATFORM = "wayland"

# rockchip-libmali doesn't actually get installed on the target just
# from being a build-time DEPENDS of libsdl2's kmsdrm PACKAGECONFIG -
# confirmed on real hardware via SSH: /usr/lib had libdrm.so.2 but no
# libgbm/libmali anywhere on the whole filesystem, even after the
# MALI_PLATFORM=gbm rebuild above, while libSDL2.so itself (confirmed
# via `strings`) does have kmsdrm compiled in and loads fine - SDL2's
# KMSDRM driver evidently dlopen()s libgbm at runtime rather than
# linking it directly, so bitbake's shlibs mechanism (which only
# tracks ELF DT_NEEDED entries) never generates an automatic RDEPENDS
# for it. Has to be installed explicitly.
IMAGE_INSTALL:append = " rockchip-libmali"

# Headers/libs for the standalone SDK (`bitbake core-image-minimal -c
# populate_sdk`) - ffmpeg/RGA/MPP/NPU only. This layer intentionally
# doesn't carry generic application libraries (SDL2, libjpeg, libuv,
# libwebsockets, ...) - anyone building just this layer for ffmpeg/
# NPU/RGA/MPP hw accel shouldn't need them. Layers that do need more
# (e.g. a private layer) append their own via the same mechanism.
TOOLCHAIN_TARGET_TASK:append = " \
    rockchip-librga-dev \
    rockchip-mpp-dev \
    ffmpeg-dev \
    libavcodec \
    libavformat \
    libavutil \
    libswscale \
    rknpu2-runtime \
"

# SSH access, password-only. dropbear (not openssh) - lightweight,
# oe-core's standard minimal-image SSH server, allows password auth by
# default with no extra config (its init script's default
# DROPBEAR_EXTRA_ARGS only sets "-w", which disables *root* login over
# SSH - unrelated to password vs key auth. No PACKAGECONFIG in
# dropbear.bb disables password auth either). ssh-server-dropbear is
# the IMAGE_FEATURES value core-image.bbclass maps to
# packagegroup-core-ssh-dropbear.
IMAGE_FEATURES:append = " ssh-server-dropbear"
