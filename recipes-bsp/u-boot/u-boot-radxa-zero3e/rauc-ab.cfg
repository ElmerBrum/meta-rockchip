# Hand-rolled RAUC symmetric A/B support for this board's U-Boot.
#
# U-Boot gained a NATIVE "CONFIG_BOOTMETH_RAUC" bootstd method that does
# all of this in C (see "bootstd: New bootmeth for RAUC A/B systems",
# merged upstream ~mid-2025) - but this recipe pins Kwiboo's
# rk3xxx-2024.07 fork, which predates that by a year+. Picking up the
# native bootmeth would mean rebasing an already-unverified personal WIP
# board-support fork onto much newer mainline - deliberately deferred,
# not forgotten. This fragment hand-rolls the same BOOT_ORDER/
# BOOT_<bootname>_LEFT contract RAUC's own "uboot" bootloader backend
# expects (src/bootloaders/uboot.c upstream: reads/writes these exact env
# vars, hex-formatted via g_strdup_printf("%x", ...)/g_ascii_strtoull(...,
# 16), default 3 attempts) instead.
#
# ENV STORAGE: CONFIG_ENV_IS_IN_EXT4, not FAT-on-a-boot-slot and not a
# second raw MMC offset.
#   - Not FAT-on-boot_a/boot_b: every RAUC update overwrites that slot's
#     ENTIRE boot partition - env living there would self-destruct
#     mid-update, corrupting the very bookkeeping RAUC's crash-loop
#     protection depends on.
#   - Not a raw offset: this board's SPL already has ONE documented
#     fragile fixed-raw-sector dependency (u-boot.itb at sector 16384,
#     see wic/radxa-zero3e.wks.in's own comment) - adding a second,
#     independent raw offset is the same risk class with no GPT
#     self-description to protect against an accidental overlap.
#   - CONFIG_ENV_EXT4_DEVICE_AND_PART="1:6" - device 1 (confirmed on
#     real hardware 2026-10-09: `mmc list` shows exactly one controller,
#     "mmc@fe2b0000: 1" - U-Boot's own "<path>: <dev-index>" listing
#     format, so this SD card enumerates as mmc dev 1, not 0 as
#     originally guessed; `mmc dev 0` failed with "MMC Device 0 not
#     found", `mmc dev 1` switched cleanly), partition index 6 on the
#     wks layout as currently ordered (idblock, uboot, trust, boot_a,
#     boot_b, rootfs_a, rootfs_b, data = index 6 counting from 1, trust
#     being index 2 - CONFIRM this index still matches
#     wic/radxa-zero3e.wks.in's actual partition order before touching
#     either file; they must change together, exactly like the SPL
#     offset already does).
#   - EXT4 read/write in THIS specific U-Boot build is otherwise still
#     unconfirmed - FAT is proven (today's working boot partition +
#     extlinux.conf); EXT4 is not. CONFIG_ENV_IS_IN_EXT4 auto-selects
#     FS_EXT4+EXT4_WRITE so this is explicit/traceable rather than an
#     implicit default. Still the single highest-value thing to
#     validate in isolation (Stage 2: does saveenv/fw_setenv actually
#     round-trip here) before trusting the rest of this file.
#   - First real boot (2026-10-09) printed "Saving Environment to
#     nowhere... not possible" - that exact string is env/nowhere.c's
#     own save() message, confirming ENV_IS_IN_EXT4 did NOT actually
#     take effect despite being requested here. env/Kconfig has NO
#     formal "choice" wrapper around ENV_IS_IN_*/ENV_IS_NOWHERE
#     (confirmed by reading it directly) - these are independent bools,
#     and backend selection happens via plain Makefile
#     obj-$(CONFIG_ENV_IS_IN_*) conditionals, not Kconfig-enforced
#     exclusivity. The defconfig has no CONFIG_ENV_* lines at all, so
#     whatever made NOWHERE win isn't visible from the defconfig text -
#     explicitly disabling it here, rather than trusting merge_config.sh
#     + oldconfig to resolve the ambiguity the way a real Kconfig
#     "choice" would have.
# CONFIG_ENV_IS_NOWHERE is not set
CONFIG_ENV_IS_IN_EXT4=y
CONFIG_FS_EXT4=y
CONFIG_EXT4_WRITE=y
CONFIG_ENV_EXT4_INTERFACE="mmc"
CONFIG_ENV_EXT4_DEVICE_AND_PART="1:6"
CONFIG_ENV_EXT4_FILE="/uboot.env"
CONFIG_ENV_SIZE=0x4000

# Both confirmed missing on first real boot ("Unknown command
# 'setexpr'"/"'sysboot'") - CONFIG_CMD_SETEXPR defaults to y with no
# depends in cmd/Kconfig, but this defconfig explicitly carries
# "# CONFIG_CMD_SETEXPR is not set"; CONFIG_CMD_SYSBOOT has no
# "default y" at all and wasn't requested anywhere. Both are used
# directly in CONFIG_BOOTCOMMAND below - this was simply missing from
# this fragment's first draft, not a deeper Kconfig issue like the env
# one above.
CONFIG_CMD_SETEXPR=y
CONFIG_CMD_SYSBOOT=y
CONFIG_PXE_UTILS=y

# BOOT SELECTION: a compiled-in CONFIG_BOOTCOMMAND override, not a
# boot.scr relying on bootflow/distro_bootcmd scan order. This board's
# own include/configs/rockchip-common.h sets
# BOOT_TARGETS "mmc1 mmc0 ...", and which CONFIG_BOOTMETH_* are even
# enabled in this exact defconfig couldn't be confirmed ahead of a real
# build - a boot.scr's "will it be found before extlinux.conf" would be
# a second unconfirmed variable stacked on a first. A compiled-in
# CONFIG_BOOTCOMMAND runs unconditionally, before bootflow/distro_bootcmd
# logic is even consulted.
#
# Script logic, each property deliberate:
#   - BOOT_A_LEFT/BOOT_B_LEFT/BOOT_ORDER self-seed to "3"/"3"/"A B" on
#     first boot (test -z), matching RAUC's own UBOOT_DEFAULT_ATTEMPTS.
#   - Values are kept <= 9 everywhere by design: U-Boot's "test -gt"
#     parses operands via simple_strtol(..., 0) - decimal for a plain
#     digit string - while "setexpr" parses via hextoul() - always hex.
#     RAUC itself always writes/reads hex. A single decimal digit (0-9)
#     is byte-identical under either interpretation, so this mismatch
#     between U-Boot's own commands is harmless ONLY as long as no
#     counter ever reaches two digits - do not raise RAUC's
#     boot_attempts/boot_attempts_primary above 9 in system.conf without
#     redoing this script's parsing to match.
#   - Decrement-before-attempt: BOOT_<X>_LEFT is saveenv'd *before*
#     sysboot runs, so a hang/panic forcing a hardware reset still
#     counts against that slot on the next cold boot.
#   - "part number mmc <dev> boot_a rauc_bp" resolves the partition
#     INDEX BY GPT NAME at runtime (confirmed syntax: part_get_info_by_name
#     fallback when the <part> arg doesn't parse as a bare number) -
#     deliberately avoids a second hardcoded-partition-index dependency.
#     Confirmed working on real hardware 2026-10-09 (devnum=1 fix) -
#     this line itself was never the problem.
#   - "sysboot mmc <dev>:<part> any ${pxefile_addr_r} /extlinux/extlinux.conf" -
#     BOTH addr and filename must be given explicitly. sysboot's syntax
#     is "[-p] <interface> <dev[:part]> <ext2|fat|any> [addr]
#     [filename]" - positional, so giving a filename while omitting addr
#     (an earlier draft of this script did exactly that) makes the
#     parser read the filename string AS the addr argument instead,
#     leaving filename genuinely unset and falling back to ${bootfile}
#     (unset) - confirmed on real hardware 2026-10-09 ("Specify a
#     filename or set the ${bootfile} environment variable", not a
#     parsing failure of the whole CONFIG_BOOTCOMMAND string, just this
#     one positional-argument mistake). ${pxefile_addr_r} isn't defined
#     anywhere in this board's own include/configs/rockchip-common.h -
#     it must come from a generic/shared U-Boot distro-boot header
#     instead, since this board's OWN pre-RAUC boot already proves it
#     works (the existing distro_bootcmd/sysboot flow this replaces
#     fundamentally depends on the same variable) - trusted rather than
#     hardcoding a new scratch address ourselves, which would risk
#     colliding with wherever the kernel/dtb actually load.
#   - BOOT_ORDER string compare ("B A") mirrors RAUC's own set_primary(),
#     which rebuilds the list starting with the target slot's bootname -
#     required to match what RAUC itself writes, not an arbitrary
#     convention.
#   - Exhaustion never hard-bricks: if both counters hit 0 (no recovery
#     slot exists on this design), both are reset to 3 and slot A is
#     retried anyway ("limp mode") rather than dropping to a U-Boot
#     prompt nobody can reach on a kiosk device with no physical console
#     access. Only visible via the serial debug console (echo) today.
#
# rauc_devnum=1 - confirmed on real hardware 2026-10-09 (see
# CONFIG_ENV_EXT4_DEVICE_AND_PART's own comment above - same
# controller, same reasoning). The BOOT_TARGETS ordering in
# rockchip-common.h doesn't tell us this since we bypass that scan
# entirely - this had to be checked directly via `mmc list`/`mmc dev`.
#
# Quoting/escaping here is confirmed well-formed enough for U-Boot to
# actually parse and execute the whole string on real hardware (it
# reached setexpr/part/sysboot rather than failing to parse the string
# itself) - but NOT yet confirmed correct end-to-end: the second real
# boot (still 2026-10-09, after fixing devnum) failed earlier than the
# devnum-dependent "part number" line even runs - setexpr/sysboot
# weren't compiled in at all (see CONFIG_CMD_SETEXPR/CONFIG_CMD_SYSBOOT
# above), so whether devnum=0 was ever actually the thing standing
# between the FIRST boot and a successful sysboot was never actually
# isolated. Don't treat "it reached the prompt" as confirmation of
# anything beyond parse-correctness until a boot actually gets past
# sysboot. Still watch for the hex-vs-decimal counter behavior noted
# above as this gets exercised further (Stage 3: deliberate slot
# failure/exhaustion testing).
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="if test -z \"${BOOT_A_LEFT}\"; then setenv BOOT_A_LEFT 3; setenv BOOT_B_LEFT 3; setenv BOOT_ORDER \"A B\"; saveenv; fi; setenv rauc_devnum 1; setenv rauc_uuid_a 614e0000-0000-4b53-8000-1d28000054aa; setenv rauc_uuid_b 614e0000-0000-4b53-8000-1d28000054ab; setenv rauc_try_a 'if test ${BOOT_A_LEFT} -gt 0; then setexpr BOOT_A_LEFT ${BOOT_A_LEFT} - 1; saveenv; setenv rauc_root PARTUUID=${rauc_uuid_a}; part number mmc ${rauc_devnum} boot_a rauc_bp && sysboot mmc ${rauc_devnum}:${rauc_bp} any ${pxefile_addr_r} /extlinux/extlinux.conf; fi'; setenv rauc_try_b 'if test ${BOOT_B_LEFT} -gt 0; then setexpr BOOT_B_LEFT ${BOOT_B_LEFT} - 1; saveenv; setenv rauc_root PARTUUID=${rauc_uuid_b}; part number mmc ${rauc_devnum} boot_b rauc_bp && sysboot mmc ${rauc_devnum}:${rauc_bp} any ${pxefile_addr_r} /extlinux/extlinux.conf; fi'; if test \"${BOOT_ORDER}\" = \"B A\"; then run rauc_try_b; run rauc_try_a; else run rauc_try_a; run rauc_try_b; fi; echo RAUC: both slots exhausted - forcing limp-mode boot; setenv BOOT_A_LEFT 3; setenv BOOT_B_LEFT 3; saveenv; run rauc_try_a; run rauc_try_b"
